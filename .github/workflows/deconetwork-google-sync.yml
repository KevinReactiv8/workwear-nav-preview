name: DecoNetwork → Google Shopping Sync

# Runs every 24 hours. Extracts products from DecoNetwork and syncs them into
# Google Shopping (Merchant API). Also runnable on demand from the Actions tab.
on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC daily
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not write to Google)'
        type: boolean
        default: false
      sync_mode:
        description: 'Sync mode'
        type: choice
        options: [api, feed, both]
        default: both

# Prevent overlapping runs if one takes longer than expected.
concurrency:
  group: deconetwork-google-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: deconetwork-google-sync
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: deconetwork-google-sync/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Persist the incremental/cleanup state file across scheduled runs.
      # Unique key each run + prefix restore-keys = rolling "latest" cache.
      # If the cache is ever evicted, the app simply does a full sync that
      # run (self-healing), so this is an optimisation, not a dependency.
      - name: Restore sync state
        uses: actions/cache@v4
        with:
          path: deconetwork-google-sync/output/.sync-state.json
          key: dn-sync-state-${{ github.run_id }}
          restore-keys: |
            dn-sync-state-

      - name: Sync products
        env:
          # ---- DecoNetwork (source) ----
          DECONETWORK_API_BASE: ${{ secrets.DECONETWORK_API_BASE }}
          DECONETWORK_USERNAME: ${{ secrets.DECONETWORK_USERNAME }}
          DECONETWORK_PASSWORD: ${{ secrets.DECONETWORK_PASSWORD }}
          # ---- Google Shopping (destination) ----
          GOOGLE_MERCHANT_ID: ${{ secrets.GOOGLE_MERCHANT_ID }}
          GOOGLE_DATA_SOURCE_ID: ${{ secrets.GOOGLE_DATA_SOURCE_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # ---- Behaviour ----
          # Use the live DecoNetwork API when credentials are present; otherwise
          # the app skips cleanly (keeping this job green) until secrets are set.
          PRODUCT_SOURCE: ${{ secrets.DECONETWORK_API_BASE && 'deconetwork' || 'fixture' }}
          SYNC_MODE: ${{ github.event.inputs.sync_mode || 'both' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          # Push only changed products (efficient); flip cleanup on to also
          # remove products deleted from DecoNetwork. Configure via repo vars.
          INCREMENTAL: ${{ vars.INCREMENTAL || 'true' }}
          CLEANUP_STALE: ${{ vars.CLEANUP_STALE || 'false' }}
          STATE_PATH: output/.sync-state.json
          CURRENCY: ${{ vars.CURRENCY || 'GBP' }}
          GOOGLE_FEED_LABEL: ${{ vars.GOOGLE_FEED_LABEL || 'GB' }}
          GOOGLE_CONTENT_LANGUAGE: ${{ vars.GOOGLE_CONTENT_LANGUAGE || 'en' }}
          FEED_OUTPUT_PATH: output/google-shopping-feed.xml
          LOG_LEVEL: info
        run: npm run sync

      - name: Upload feed + report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-output
          path: |
            deconetwork-google-sync/output/google-shopping-feed.xml
            deconetwork-google-sync/output/last-run-report.md
          if-no-files-found: ignore
          retention-days: 14
