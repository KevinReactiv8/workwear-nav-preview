services:
  - type: web
    name: stitchdraft-studio
    runtime: python
    rootDir: stitchdraft-app
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: STITCHDRAFT_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
